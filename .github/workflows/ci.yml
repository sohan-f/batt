name: Android CI

on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - '**.md'
      - '.gitignore'
  pull_request:
    branches:
      - main
      - master
    paths-ignore:
      - '**.md'
      - '.gitignore'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Make Gradle Wrapper Executable
        run: chmod +x ./gradlew

      - name: Run Build
        run: ./gradlew assembleDebug -PsplitApks -PtargetAbi=arm64-v8a

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: CircleBattery-debug-arm64-v8a
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
