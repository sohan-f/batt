name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v7.3.0, leave empty to use tag from ref or version)'
        required: false
        default: ''
        type: string
      release_title:
        description: 'Release Title (optional, e.g. Circle Battery v7.3.0)'
        required: false
        default: ''
        type: string
      build_type:
        description: 'Build Type'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug
          - both
      prerelease:
        description: 'Mark as Pre-release'
        required: false
        default: false
        type: boolean
      draft:
        description: 'Mark as Draft'
        required: false
        default: false
        type: boolean

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-release:
    name: Build & Release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Make Gradle Wrapper Executable
        run: chmod +x ./gradlew

      - name: Configure Keystore (Optional)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Configuring release keystore from secrets..."
            echo "$KEYSTORE_BASE64" | base64 --decode > keystore.jks
            cat <<EOF > keystore.properties
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          storeFile=keystore.jks
          storePassword=$STORE_PASSWORD
          EOF
          else
            echo "No custom keystore secret found. Build will sign with default signing configuration."
          fi

      - name: Determine Version and Tag
        id: release_info
        run: |
          # Extract versionName from app/build.gradle.kts
          VERSION_NAME=$(grep 'versionName = ' app/build.gradle.kts | head -n1 | sed -E 's/.*versionName = "([^"]+)".*/\1/')
          if [ -z "$VERSION_NAME" ]; then
            VERSION_NAME="1.0.0"
          fi
          echo "VERSION_NAME=${VERSION_NAME}" >> "$GITHUB_OUTPUT"

          # Determine Tag Name
          INPUT_TAG="${{ github.event.inputs.tag_name }}"
          if [ -n "$INPUT_TAG" ]; then
            TAG_NAME="$INPUT_TAG"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG_NAME="${GITHUB_REF#refs/tags/}"
          else
            TAG_NAME="v${VERSION_NAME}"
          fi
          echo "TAG_NAME=${TAG_NAME}" >> "$GITHUB_OUTPUT"

          # Determine Release Title
          INPUT_TITLE="${{ github.event.inputs.release_title }}"
          if [ -n "$INPUT_TITLE" ]; then
            RELEASE_TITLE="$INPUT_TITLE"
          else
            RELEASE_TITLE="Circle Battery ${TAG_NAME}"
          fi
          echo "RELEASE_TITLE=${RELEASE_TITLE}" >> "$GITHUB_OUTPUT"

      - name: Build APK(s)
        run: |
          BUILD_TYPE="${{ github.event.inputs.build_type }}"
          if [ -z "$BUILD_TYPE" ]; then
            BUILD_TYPE="release"
          fi

          if [ "$BUILD_TYPE" = "release" ]; then
            ./gradlew assembleRelease
          elif [ "$BUILD_TYPE" = "debug" ]; then
            ./gradlew assembleDebug
          elif [ "$BUILD_TYPE" = "both" ]; then
            ./gradlew assembleRelease assembleDebug
          fi

      - name: Prepare Release Artifacts
        id: prepare_artifacts
        run: |
          mkdir -p release-assets
          VERSION_NAME="${{ steps.release_info.outputs.VERSION_NAME }}"

          # Copy and rename release APK if built
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk release-assets/CircleBattery-${VERSION_NAME}-release.apk
          elif [ -f app/build/outputs/apk/release/app-release-unsigned.apk ]; then
            cp app/build/outputs/apk/release/app-release-unsigned.apk release-assets/CircleBattery-${VERSION_NAME}-release-unsigned.apk
          fi

          # Copy and rename debug APK if built
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk release-assets/CircleBattery-${VERSION_NAME}-debug.apk
          fi

          # Generate SHA-256 checksums
          cd release-assets
          for file in *.apk; do
            if [ -f "$file" ]; then
              sha256sum "$file" > "${file}.sha256"
            fi
          done
          cd ..

          echo "Release assets prepared:"
          ls -la release-assets/

      - name: Upload Artifacts to GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: circle-battery-apk
          path: release-assets/
          if-no-files-found: error

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ steps.release_info.outputs.TAG_NAME }}
          name: ${{ steps.release_info.outputs.RELEASE_TITLE }}
          draft: ${{ github.event.inputs.draft || false }}
          prerelease: ${{ github.event.inputs.prerelease || false }}
          files: release-assets/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
